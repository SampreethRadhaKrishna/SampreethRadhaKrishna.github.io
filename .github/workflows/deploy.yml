# Publishes the site to https://sampreeth98.github.io/.
# Repo settings -> Pages -> Source must be "GitHub Actions" (not "Deploy from a branch").
# Only `test` (the default, working branch) publishes on push. There is one live site,
# so a second deploying branch would overwrite it with whichever was pushed last.
name: Deploy to GitHub Pages

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let a running deploy finish; a newer push queues behind it.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
